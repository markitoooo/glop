<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glop · Next‑gen AI Chat</title>
    <!-- PDF.js for PDF text extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1e2a3a;
        }

        /* Main app container */
        .app {
            width: 100%;
            max-width: 1600px;
            height: 95vh;
            background: white;
            border-radius: 32px;
            box-shadow: 0 25px 60px -15px rgba(0, 20, 30, 0.25);
            display: flex;
            overflow: hidden;
            backdrop-filter: blur(2px);
        }

        /* ---------- Sidebar (history) ---------- */
        .sidebar {
            width: 280px;
            background: #f9fbfd;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            transition: width 0.2s;
        }

        .sidebar-header {
            padding: 24px 20px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: -0.02em;
            background: linear-gradient(145deg, #0b5e7c, #1f8fb0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .temp-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #4a5b6e;
            background: #e9eef3;
            padding: 4px 10px;
            border-radius: 40px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .temp-toggle.active {
            background: #ffe7b3;
            color: #8e6100;
        }

        .temp-toggle .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
        }

        .temp-toggle.active .indicator {
            background: #f59e0b;
            box-shadow: 0 0 6px #f59e0b;
        }

        .new-chat-btn {
            margin: 8px 16px 16px;
            background: white;
            border: 1px solid #d0d9e3;
            border-radius: 40px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            color: #1e2a3a;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .new-chat-btn:hover {
            background: #eef2f6;
            border-color: #a0b3c9;
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px;
        }

        .conv-item {
            padding: 12px 14px;
            margin-bottom: 4px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.15s;
            color: #334155;
            font-size: 0.9rem;
            word-break: break-word;
        }

        .conv-item:hover {
            background: #eef2f6;
        }

        .conv-item.active {
            background: #e0e8f0;
            font-weight: 500;
            color: #0b5e7c;
        }

        .conv-item .icon {
            font-size: 1.1rem;
            opacity: 0.7;
        }

        .conv-item .title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conv-item .delete {
            opacity: 0;
            font-size: 1.2rem;
            line-height: 1;
            padding: 0 4px;
            border-radius: 50%;
            transition: opacity 0.2s, background 0.2s;
        }

        .conv-item:hover .delete {
            opacity: 0.5;
        }

        .conv-item .delete:hover {
            opacity: 1;
            background: #d1dbe6;
        }

        .sidebar-footer {
            padding: 20px 16px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.75rem;
            color: #7e8b9c;
            text-align: center;
        }

        /* ---------- Main chat area ---------- */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            position: relative;
        }

        /* Chat header (model selector + temp indicator) */
        .chat-header {
            padding: 16px 28px;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(8px);
            z-index: 5;
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f1f5f9;
            padding: 6px 12px 6px 18px;
            border-radius: 40px;
            border: 1px solid #dde3e9;
        }

        .model-selector label {
            font-size: 0.85rem;
            color: #4a5b6e;
        }

        .model-selector select {
            background: transparent;
            border: none;
            font-weight: 500;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            color: #0f172a;
            padding: 4px 0;
        }

        .temp-badge {
            background: #f1f5f9;
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.8rem;
            color: #4b5b6e;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .temp-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
        }

        .temp-badge.active .dot {
            background: #f59e0b;
            box-shadow: 0 0 6px #f59e0b;
        }

        /* Quick action chips (now above input) */
        .chips-container {
            padding: 12px 28px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .chip {
            background: #f1f5f9;
            border: 1px solid #dde3e9;
            border-radius: 40px;
            padding: 6px 18px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #2c3e50;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .chip:hover {
            background: #e2eaf2;
            border-color: #9bb0c7;
        }

        .chip:active {
            transform: scale(0.96);
        }

        /* Messages area */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #ffffff;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            gap: 16px;
            max-width: 90%;
            animation: fadeSlide 0.2s ease-out;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #edf2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
            border: 1px solid #dde3e9;
        }

        .user .avatar {
            background: #0b5e7c;
            color: white;
            border-color: #0b5e7c;
        }

        .bubble {
            padding: 16px 20px;
            border-radius: 24px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: calc(100% - 54px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .user .bubble {
            background: #0b5e7c;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai .bubble {
            background: #f8fafd;
            color: #1e2a3a;
            border: 1px solid #e9eef2;
            border-bottom-left-radius: 4px;
        }

        /* Typing indicator */
        .typing {
            display: flex;
            gap: 5px;
            padding: 12px 18px;
            background: #f8fafd;
            border: 1px solid #e9eef2;
            border-radius: 24px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #94a3b8;
            border-radius: 50%;
            display: inline-block;
            animation: typing 1.4s infinite ease-in-out both;
        }

        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Message formatting (code blocks, etc.) */
        .bubble h1, .bubble h2, .bubble h3 {
            margin: 0.6em 0 0.3em;
            font-weight: 600;
            line-height: 1.3;
        }
        .bubble h1 { font-size: 1.5rem; }
        .bubble h2 { font-size: 1.3rem; }
        .bubble h3 { font-size: 1.1rem; }
        .bubble p { margin: 0.5em 0; }
        .bubble ul, .bubble ol { margin: 0.5em 0; padding-left: 1.5em; }
        .bubble li { margin: 0.2em 0; }
        .bubble strong { font-weight: 600; }
        .bubble em { font-style: italic; }
        .bubble code {
            background: #eef2f6;
            padding: 0.2em 0.4em;
            border-radius: 6px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.9em;
            color: #0b3b5c;
        }
        .user .bubble code {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        .pre-code-block {
            position: relative;
            margin: 0.8em 0;
        }
        .pre-code-block pre {
            background: #0d1b2a;
            color: #e2e8f0;
            padding: 1em;
            border-radius: 12px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            margin: 0;
        }
        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #1e2a3a;
            color: #a0b8cc;
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.7rem;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s, background 0.2s;
            font-family: inherit;
        }
        .copy-btn:hover {
            opacity: 1;
            background: #2d3f57;
            color: white;
        }

        /* Input area */
        .input-area {
            padding: 16px 28px 24px;
            background: white;
            border-top: 1px solid #edf2f7;
        }

        /* Attachments bar */
        .attachments {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .file-pill {
            background: #f1f5f9;
            border: 1px solid #dde3e9;
            border-radius: 40px;
            padding: 4px 12px 4px 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #1e2a3a;
        }

        .file-pill .remove-file {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 1.2rem;
            line-height: 1;
            padding: 0 4px;
            border-radius: 50%;
            transition: background 0.2s, color 0.2s;
        }

        .file-pill .remove-file:hover {
            background: #e2e8f0;
            color: #b91c1c;
        }

        .clear-files {
            background: none;
            border: 1px solid #dde3e9;
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 0.8rem;
            color: #64748b;
            cursor: pointer;
            transition: background 0.2s;
        }

        .clear-files:hover {
            background: #f1f5f9;
            color: #1e2a3a;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            background: #f8fafd;
            border: 1px solid #dde3e9;
            border-radius: 32px;
            padding: 8px 8px 8px 20px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #0b5e7c;
            box-shadow: 0 0 0 3px rgba(11,94,124,0.1);
        }

        textarea {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 0;
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            max-height: 120px;
            outline: none;
            line-height: 1.5;
            color: #0f172a;
        }

        textarea::placeholder {
            color: #94a3b8;
        }

        .action-btns {
            display: flex;
            gap: 4px;
        }

        .attach-btn, .send-btn {
            background: transparent;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            flex-shrink: 0;
            color: #5f6c80;
        }

        .attach-btn:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .send-btn {
            background: #0b5e7c;
            color: white;
        }

        .send-btn:hover {
            background: #1a7a9e;
        }

        .send-btn:active {
            transform: scale(0.92);
        }

        .send-btn svg, .attach-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Hidden file input (supports folders) */
        #file-input {
            display: none;
        }

        /* Scrollbar */
        .messages::-webkit-scrollbar, .conversation-list::-webkit-scrollbar {
            width: 8px;
        }
        .messages::-webkit-scrollbar-track, .conversation-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages::-webkit-scrollbar-thumb, .conversation-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 20px;
        }
        .messages::-webkit-scrollbar-thumb:hover, .conversation-list::-webkit-scrollbar-thumb:hover {
            background: #a0b3c6;
        }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Sidebar: chat history -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span class="brand">Glop</span>
                <div class="temp-toggle" id="temp-toggle" title="Temporary mode (chats not saved)">
                    <span class="indicator"></span>
                    <span>Temp</span>
                </div>
            </div>
            <div class="new-chat-btn" id="new-chat-sidebar">
                <span>+</span> New chat
            </div>
            <div class="conversation-list" id="conversation-list">
                <!-- Populated by JS -->
            </div>
            <div class="sidebar-footer">
                Files & folders processed locally
            </div>
        </div>

        <!-- Main chat area -->
        <div class="main">
            <!-- Header with model selector & temp status -->
            <div class="chat-header">
                <div class="model-selector">
                    <label for="model-select">Model:</label>
                    <select id="model-select">
                        <option value="moonshotai/kimi-k2.5">Kimi K2.5 (Balanced)</option>
                        <option value="moonshotai/kimi-k2">Kimi K2 (Fast)</option>
                        <option value="moonshotai/kimi-k2-thinking">Kimi K2 Thinking (Reasoning)</option>
                        <option value="moonshotai/kimi-k2-0905">Kimi K2‑0905 (Complex)</option>
                    </select>
                </div>
                <div class="temp-badge" id="temp-badge">
                    <span class="dot"></span>
                    <span id="temp-label">Saving chats</span>
                </div>
            </div>

            <!-- Quick action chips (removed Chinese) -->
            <div class="chips-container">
                <div class="chip" data-prompt="Explain artificial intelligence in simple terms">🤖 AI basics</div>
                <div class="chip" data-prompt="Write a Python function to read a CSV file and calculate the mean of each column">🐍 Code help</div>
                <div class="chip" data-prompt="What are the environmental impacts of electric vehicles?">🌍 Environment</div>
                <div class="chip" data-prompt="Compare functional programming with object-oriented programming">⚡ Programming paradigms</div>
            </div>

            <!-- Messages -->
            <div class="messages" id="messages"></div>

            <!-- Input area with attachments -->
            <div class="input-area">
                <div class="attachments" id="attachments-container"></div>
                <div class="input-wrapper">
                    <textarea id="user-input" placeholder="Ask anything or upload files/folders..." rows="1"></textarea>
                    <div class="action-btns">
                        <button class="attach-btn" id="attach-btn" aria-label="Attach files or folders">
                            <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
                        </button>
                        <button class="send-btn" id="send-btn" aria-label="Send">
                            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                        </button>
                    </div>
                </div>
                <div class="footer-note">Glop uses Kimi models · Files stay private · Free, no API key</div>
            </div>
        </div>
    </div>

    <!-- Hidden file input: supports folders via webkitdirectory -->
    <input type="file" id="file-input" multiple webkitdirectory directory>

    <script src="https://js.puter.com/v2/"></script>
    <script>
        (function() {
            // Configure PDF.js
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

            // ----- DOM elements -----
            const messagesDiv = document.getElementById('messages');
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const attachBtn = document.getElementById('attach-btn');
            const fileInput = document.getElementById('file-input');
            const attachmentsContainer = document.getElementById('attachments-container');
            const modelSelect = document.getElementById('model-select');
            const chips = document.querySelectorAll('.chip');
            const newChatSidebar = document.getElementById('new-chat-sidebar');
            const conversationList = document.getElementById('conversation-list');
            const tempToggle = document.getElementById('temp-toggle');
            const tempBadge = document.getElementById('temp-badge');
            const tempLabel = document.getElementById('temp-label');

            // ----- State -----
            let conversations = [];                // array of { id, name, messages, createdAt, updatedAt }
            let currentConversationId = null;      // id of active conversation
            let uploadedFiles = [];                 // { name, content, type }
            let tempMode = false;                   // if true, don't save to localStorage

            // ----- Load conversations from localStorage -----
            function loadConversations() {
                try {
                    const stored = localStorage.getItem('glop_conversations');
                    if (stored) {
                        conversations = JSON.parse(stored);
                    } else {
                        // Create a default welcome conversation
                        const welcomeMsg = { role: 'assistant', content: "Hello, I'm Glop. You can upload entire folders – I'll read all text files and PDFs. Ask me anything!" };
                        conversations = [{
                            id: generateId(),
                            name: 'Welcome',
                            messages: [welcomeMsg],
                            createdAt: Date.now(),
                            updatedAt: Date.now()
                        }];
                    }
                } catch (e) {
                    conversations = [];
                }
                // Ensure at least one conversation
                if (conversations.length === 0) {
                    conversations.push({
                        id: generateId(),
                        name: 'New chat',
                        messages: [{ role: 'assistant', content: 'Hello! How can I help?' }],
                        createdAt: Date.now(),
                        updatedAt: Date.now()
                    });
                }
                // Set current to the most recent (first in list after sorting)
                sortConversations();
                currentConversationId = conversations[0].id;
            }

            function sortConversations() {
                conversations.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
            }

            // Save conversations to localStorage (unless temp mode)
            function saveConversations() {
                if (tempMode) return;
                try {
                    localStorage.setItem('glop_conversations', JSON.stringify(conversations));
                } catch (e) {}
            }

            // Generate simple id
            function generateId() {
                return Date.now() + '-' + Math.random().toString(36).substr(2, 9);
            }

            // Get current conversation object
            function currentConv() {
                return conversations.find(c => c.id === currentConversationId);
            }

            // Update current conversation's messages and timestamp
            function updateCurrentConversation(messages) {
                const conv = currentConv();
                if (conv) {
                    conv.messages = messages;
                    conv.updatedAt = Date.now();
                    // Auto-generate name from first user message if exists
                    const firstUserMsg = messages.find(m => m.role === 'user');
                    if (firstUserMsg) {
                        conv.name = firstUserMsg.content.slice(0, 30) + (firstUserMsg.content.length > 30 ? '…' : '');
                    } else {
                        conv.name = 'New chat';
                    }
                    sortConversations();
                    renderSidebar();
                    saveConversations();
                }
            }

            // Switch to a conversation by id
            function switchConversation(id) {
                if (id === currentConversationId) return;
                currentConversationId = id;
                // Clear uploaded files when switching? Better to keep them per conversation? We'll reset for simplicity.
                uploadedFiles = [];
                renderAttachments();
                renderMessages();
                highlightActiveConversation();
            }

            // Create new conversation
            function newConversation() {
                const newId = generateId();
                conversations.unshift({
                    id: newId,
                    name: 'New chat',
                    messages: [{ role: 'assistant', content: 'Hello! How can I help?' }],
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                });
                currentConversationId = newId;
                uploadedFiles = [];
                renderAttachments();
                renderSidebar();
                renderMessages();
                saveConversations();
            }

            // Delete conversation
            function deleteConversation(id, event) {
                event.stopPropagation();
                if (conversations.length <= 1) {
                    alert('Cannot delete the only conversation.');
                    return;
                }
                conversations = conversations.filter(c => c.id !== id);
                if (currentConversationId === id) {
                    currentConversationId = conversations[0].id;
                    uploadedFiles = [];
                }
                renderSidebar();
                renderMessages();
                saveConversations();
            }

            // Render sidebar list
            function renderSidebar() {
                let html = '';
                conversations.forEach(conv => {
                    const activeClass = conv.id === currentConversationId ? 'active' : '';
                    html += `<div class="conv-item ${activeClass}" data-id="${conv.id}">
                        <span class="icon">💬</span>
                        <span class="title">${escapeHtml(conv.name)}</span>
                        <span class="delete" data-id="${conv.id}">✕</span>
                    </div>`;
                });
                conversationList.innerHTML = html;

                // Attach click events
                document.querySelectorAll('.conv-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        if (e.target.classList.contains('delete')) return;
                        const id = item.dataset.id;
                        switchConversation(id);
                    });
                });
                document.querySelectorAll('.delete').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = btn.dataset.id;
                        deleteConversation(id, e);
                    });
                });
            }

            function highlightActiveConversation() {
                document.querySelectorAll('.conv-item').forEach(item => {
                    item.classList.remove('active');
                    if (item.dataset.id === currentConversationId) {
                        item.classList.add('active');
                    }
                });
            }

            // Render messages of current conversation
            function renderMessages() {
                const conv = currentConv();
                if (!conv) return;
                messagesDiv.innerHTML = '';
                conv.messages.forEach(msg => {
                    addMessageToUI(msg.content, msg.role, false); // false = don't return id
                });
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            // Helper to add a message to UI (and optionally to history)
            function addMessageToUI(content, sender, addToHistory = false, returnId = false) {
                const messageDiv = document.createElement('div');
                const id = 'msg-' + Date.now() + '-' + Math.random().toString(36).substring(2, 10);
                messageDiv.id = id;
                messageDiv.className = `message ${sender}`;

                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                avatar.textContent = sender === 'user' ? '👤' : '✨';
                messageDiv.appendChild(avatar);

                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                if (sender === 'ai' && content) {
                    bubble.innerHTML = formatMarkdown(content);
                } else {
                    bubble.textContent = content;
                }
                messageDiv.appendChild(bubble);

                messagesDiv.appendChild(messageDiv);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;

                if (addToHistory) {
                    const conv = currentConv();
                    if (conv) {
                        conv.messages.push({ role: sender, content });
                        updateCurrentConversation(conv.messages);
                    }
                }
                return returnId ? id : null;
            }

            // Update AI message (streaming)
            function updateAIMessage(id, content) {
                const msgDiv = document.getElementById(id);
                if (!msgDiv) return;
                const bubble = msgDiv.querySelector('.bubble');
                if (bubble) {
                    bubble.innerHTML = formatMarkdown(content);
                }
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            // Typing indicator
            function addTypingIndicator() {
                const id = 'typing-' + Date.now();
                const div = document.createElement('div');
                div.id = id;
                div.className = 'message ai';
                div.innerHTML = `<div class="avatar">✨</div><div class="typing"><span></span><span></span><span></span></div>`;
                messagesDiv.appendChild(div);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                return id;
            }

            function removeElement(id) {
                const el = document.getElementById(id);
                if (el) el.remove();
            }

            // Build context string including uploaded files
            function buildContext() {
                let context = '';

                if (uploadedFiles.length > 0) {
                    context += "The user has uploaded the following files with their contents:\n\n";
                    uploadedFiles.forEach(file => {
                        context += `--- ${file.name} ---\n${file.content}\n\n`;
                    });
                    context += "--- End of uploaded files ---\n\n";
                }

                const conv = currentConv();
                if (conv) {
                    context += conv.messages.map(msg => 
                        `${msg.role === 'user' ? 'User' : 'Assistant'}: ${msg.content}`
                    ).join('\n\n');
                }
                return context;
            }

            // Send message
            async function sendMessage(initialMessage = null) {
                let messageText = initialMessage !== null ? initialMessage : userInput.value.trim();
                if (!messageText && uploadedFiles.length === 0) return;

                if (!messageText && uploadedFiles.length > 0) {
                    messageText = "Please analyze the attached files.";
                }

                if (initialMessage === null) {
                    userInput.value = '';
                    userInput.style.height = 'auto';
                }

                // Add user message to UI and history
                addMessageToUI(messageText, 'user', true); // adds to history automatically

                // Prepare full prompt
                const fullPrompt = buildContext();

                const typingId = addTypingIndicator();

                try {
                    const model = modelSelect.value;
                    const response = await puter.ai.chat(fullPrompt, { 
                        model: model,
                        stream: true 
                    });

                    removeElement(typingId);

                    const aiMessageId = addMessageToUI('', 'ai', false, true); // placeholder, not yet in history

                    let fullResponse = '';
                    for await (const part of response) {
                        if (part?.text) {
                            fullResponse += part.text;
                            requestAnimationFrame(() => updateAIMessage(aiMessageId, fullResponse));
                        }
                    }

                    // Add final response to history
                    const conv = currentConv();
                    if (conv) {
                        conv.messages.push({ role: 'assistant', content: fullResponse });
                        updateCurrentConversation(conv.messages);
                    }
                } catch (error) {
                    removeElement(typingId);
                    const errorMsg = '❌ Error: ' + error.message;
                    addMessageToUI(errorMsg, 'ai', true);
                }
            }

            // Render file attachments
            function renderAttachments() {
                if (uploadedFiles.length === 0) {
                    attachmentsContainer.innerHTML = '';
                    return;
                }

                let html = '';
                uploadedFiles.forEach((file, index) => {
                    html += `<span class="file-pill">📄 ${escapeHtml(file.name)} <button class="remove-file" data-index="${index}">×</button></span>`;
                });
                html += `<button class="clear-files" id="clear-files">Clear all</button>`;
                attachmentsContainer.innerHTML = html;

                document.querySelectorAll('.remove-file').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const index = e.target.getAttribute('data-index');
                        if (index !== null) {
                            uploadedFiles.splice(index, 1);
                            renderAttachments();
                        }
                    });
                });

                const clearBtn = document.getElementById('clear-files');
                if (clearBtn) {
                    clearBtn.addEventListener('click', () => {
                        uploadedFiles = [];
                        renderAttachments();
                    });
                }
            }

            // Read file content (text or PDF)
            async function readFileContent(file) {
                const name = file.name;
                const type = file.type;

                // Text files
                if (type.startsWith('text/') || name.match(/\.(txt|md|json|csv|js|py|html|css|xml|yml|yaml|ini|log|rtf|sh|bat|ps1|go|rs|java|cpp|c|h|php|rb|swift|kt|ts|jsx|tsx|vue|svelte|scala|dart|lua|r|pl|pm|t|sql|graphql|gradle|tf|yaml|toml)$/i)) {
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.onerror = (e) => reject(e.target.error);
                        reader.readAsText(file);
                    });
                }
                // PDF
                else if (type === 'application/pdf' || name.endsWith('.pdf')) {
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        let fullText = '';
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            const strings = textContent.items.map(item => item.str);
                            fullText += strings.join(' ') + '\n';
                        }
                        return fullText;
                    } catch (err) {
                        throw new Error('PDF extraction failed: ' + err.message);
                    }
                }
                // Unsupported
                else {
                    throw new Error('Unsupported file type. Please upload text files or PDFs.');
                }
            }

            // Process uploaded files/folders
            async function onFileUpload() {
                const files = Array.from(fileInput.files);
                if (files.length === 0) return;

                // Optional: show loading indicator
                const loadingId = addMessageToUI(`📂 Uploading ${files.length} file(s)...`, 'ai', false, true);
                let successCount = 0;
                let errorCount = 0;

                for (let file of files) {
                    // Limit file size (10MB)
                    if (file.size > 10 * 1024 * 1024) {
                        addMessageToUI(`⚠️ Skipped ${file.name} (exceeds 10MB)`, 'ai', true);
                        errorCount++;
                        continue;
                    }

                    try {
                        const content = await readFileContent(file);
                        // Keep full path? Use webkitRelativePath if available
                        const path = file.webkitRelativePath || file.name;
                        uploadedFiles.push({ name: path, content, type: file.type });
                        successCount++;
                    } catch (err) {
                        addMessageToUI(`❌ Error reading ${file.name}: ${err.message}`, 'ai', true);
                        errorCount++;
                    }
                }

                removeElement(loadingId);
                addMessageToUI(`📎 Uploaded ${successCount} file(s) successfully.`, 'ai', true);
                renderAttachments();
                fileInput.value = ''; // clear input
            }

            // Toggle temporary mode
            function toggleTempMode() {
                tempMode = !tempMode;
                updateTempUI();
                if (!tempMode) {
                    // if turning off temp, save current conversations
                    saveConversations();
                }
            }

            function updateTempUI() {
                if (tempMode) {
                    tempToggle.classList.add('active');
                    tempBadge.classList.add('active');
                    tempLabel.innerText = 'Temporary mode';
                } else {
                    tempToggle.classList.remove('active');
                    tempBadge.classList.remove('active');
                    tempLabel.innerText = 'Saving chats';
                }
            }

            // Markdown formatter (same as before)
            function formatMarkdown(text) {
                if (!text) return '';

                let escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

                // Headers
                escaped = escaped.replace(/^### (.*$)/gm, '<h3>$1</h3>');
                escaped = escaped.replace(/^## (.*$)/gm, '<h2>$1</h2>');
                escaped = escaped.replace(/^# (.*$)/gm, '<h1>$1</h1>');

                // Bold & italic
                escaped = escaped.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
                escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                escaped = escaped.replace(/__(.*?)__/g, '<strong>$1</strong>');
                escaped = escaped.replace(/\*(.*?)\*/g, '<em>$1</em>');
                escaped = escaped.replace(/_(.*?)_/g, '<em>$1</em>');

                // Inline code
                escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');

                // Code blocks
                escaped = escaped.replace(/```(\w*)\n([\s\S]*?)```/gm, (match, lang, code) => {
                    return `<div class="pre-code-block"><pre><code class="language-${lang}">${escapeHtml(code.trim())}</code></pre><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>`;
                });

                // Lists
                escaped = escaped.replace(/^\* (.*$)/gm, '<ul><li>$1</li></ul>');
                escaped = escaped.replace(/^- (.*$)/gm, '<ul><li>$1</li></ul>');
                escaped = escaped.replace(/^\d+\. (.*$)/gm, '<ol><li>$1</li></ol>');
                escaped = escaped.replace(/<\/ul>\s*<ul>/g, '');
                escaped = escaped.replace(/<\/ol>\s*<ol>/g, '');

                // Paragraphs
                escaped = escaped.split('\n\n').map(para => {
                    if (para.startsWith('<h') || para.startsWith('<ul') || para.startsWith('<ol') || para.startsWith('<div')) return para;
                    return `<p>${para.replace(/\n/g, '<br>')}</p>`;
                }).join('');

                // Single line breaks
                escaped = escaped.replace(/\n/g, '<br>');

                return escaped;
            }

            function escapeHtml(unsafe) {
                return unsafe.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            window.copyCode = function(btn) {
                const pre = btn.parentElement.querySelector('pre code');
                if (pre) {
                    const text = pre.innerText;
                    navigator.clipboard.writeText(text).then(() => {
                        btn.textContent = 'Copied!';
                        setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
                    }).catch(() => {
                        btn.textContent = 'Error';
                    });
                }
            };

            // Event listeners
            sendBtn.addEventListener('click', () => sendMessage());
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            attachBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', onFileUpload);
            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    const prompt = chip.getAttribute('data-prompt');
                    sendMessage(prompt);
                });
            });
            newChatSidebar.addEventListener('click', newConversation);
            tempToggle.addEventListener('click', toggleTempMode);

            // Auto-resize textarea
            userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });

            // Initialize
            loadConversations();
            renderSidebar();
            renderMessages();
            updateTempUI();
        })();
    </script>
</body>
</html>
